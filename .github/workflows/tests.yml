name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The app is Windows-only (hotkey polling, Credential Manager, the tray), so the tests
    # run where it does. Qt draws offscreen, so no display is needed.
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest -q
